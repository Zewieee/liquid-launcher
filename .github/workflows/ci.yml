name: CI Build & Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Security Audit, Java/D8 & Rust Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Security & Hygiene Audit
        run: python3 scripts/check-maintenance.py --offline

      - name: Fetch & SHA-256 Verify Pinned Libraries
        run: |
          python3 scripts/check-maintenance.py --fetch-libs
          python3 package-reading.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK Platform 35 & Build-Tools 35.0.0
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Compile Overlay, Bridge, Validation Suites & Package DEX
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          D8="$ANDROID_HOME/build-tools/35.0.0/d8"
          LIBS_CP="$(printf '%s:' libs/*.jar | sed 's/:$//')"

          mkdir -p build/stubs build/production build/dex bridge/classes bridge/dex validation/classes validation/dex

          echo "1. Compiling host stubs..."
          find stubs stubs-extra -name '*.java' > build/stubs.list
          javac -encoding UTF-8 -source 8 -target 8 -classpath "$ANDROID_JAR" -d build/stubs @build/stubs.list
          jar cf build/stubs.jar -C build/stubs .

          echo "2. Compiling 91 Java overlay modules..."
          find src -name '*.java' > build/sources.list
          javac -encoding UTF-8 -source 8 -target 8 -classpath "$ANDROID_JAR:build/stubs:$LIBS_CP" -d build/production @build/sources.list
          jar cf build/loader.jar -C build/production .
          "$D8" --release --min-api 26 --lib "$ANDROID_JAR" --classpath build/stubs --output build/dex build/loader.jar libs/*.jar

          echo "3. Compiling ADB MediaSession bridge..."
          javac -encoding UTF-8 -source 8 -target 8 -classpath "$ANDROID_JAR" -d bridge/classes \
            bridge/SpotifyMediaBridge.java src/local/launcherfix/MediaSources.java src/local/launcherfix/YouTubeTrack.java
          jar cf bridge/bridge.jar -C bridge/classes .
          "$D8" --release --min-api 26 --lib "$ANDROID_JAR" --output bridge/dex bridge/bridge.jar

          echo "4. Compiling 37 ART verification suites..."
          find validation -name '*.java' > build/validation.list
          javac -encoding UTF-8 -source 8 -target 8 -classpath "$ANDROID_JAR:build/stubs.jar:build/loader.jar:bridge/bridge.jar:$LIBS_CP" -d validation/classes @build/validation.list
          jar cf validation/checks.jar -C validation/classes .
          "$D8" --release --min-api 26 --lib "$ANDROID_JAR" --output validation/dex/checks-bundle.jar validation/checks.jar build/stubs.jar build/loader.jar libs/*.jar
          python3 package-reading.py validation/dex/checks-bundle.jar

      - name: Check Rust JNI Engine (1.85.1)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.1
      - name: Cargo Check Native Crate
        run: cargo check --manifest-path native/Cargo.toml --locked
